<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impuestia — {% block title %}Admin{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-brand">Impuestia</div>
            <nav class="sidebar-nav">
                <a href="/dashboard" class="sidebar-link {% if request.url.path == '/dashboard' %}active{% endif %}">Dashboard</a>
                <span class="sidebar-section">Archivos</span>
                <a href="/files" class="sidebar-link {% if request.url.path.startswith('/files') %}active{% endif %}">Explorador</a>
                <a href="/works" class="sidebar-link {% if request.url.path == '/works' %}active{% endif %}">Trabajos</a>
                <span class="sidebar-section">Conocimiento</span>
                <a href="/sources" class="sidebar-link {% if request.url.path == '/sources' %}active{% endif %}">Fuentes oficiales</a>
                <a href="/research" class="sidebar-link {% if request.url.path == '/research' %}active{% endif %}">Investigación</a>
                <a href="/review/drafts" class="sidebar-link {% if request.url.path.startswith('/review/drafts') %}active{% endif %}">Arboles</a>
                <a href="/review/notas" class="sidebar-link {% if request.url.path.startswith('/review/notas') %}active{% endif %}">Notas aprobadas</a>
                <a href="/skills" class="sidebar-link {% if request.url.path.startswith('/skill') %}active{% endif %}">Skills</a>
            </nav>
            <div class="sidebar-footer">
                <a href="/logout" class="sidebar-link">Salir</a>
            </div>
        </aside>
        <main class="main-content">
            {% if message %}
            <div class="alert alert-success">{{ message }}</div>
            {% endif %}
            {% if error %}
            <div class="alert alert-error">{{ error }}</div>
            {% endif %}
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
