{% extends "base.html" %}
{% block title %}Revisar nota{% endblock %}
{% block content %}
<h1>📝 Revisar nota</h1>
<p class="hint">{{ path }}</p>
{% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}

<div class="card full-width">
    <div style="display:flex;gap:0.5rem;margin-bottom:1rem;">
        <form method="post" action="/review/notas/{{ rel_path }}/approve" style="display:inline">
            <button type="submit" class="btn btn-primary">✅ Aprobar</button>
        </form>
        <form method="post" action="/review/notas/{{ rel_path }}/unapprove" style="display:inline">
            <button type="submit" class="btn btn-outline">↩️ Desaprobar</button>
        </form>
        <a href="/review/notas" class="btn btn-outline">Volver</a>
    </div>
    <pre class="nota-preview">{{ content }}</pre>
</div>
{% endblock %}
